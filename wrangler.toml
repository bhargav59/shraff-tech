name = "shraff-tech"
main = "worker/index.ts"
compatibility_date = "2026-11-25"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

# Serve the Vite build directly from Cloudflare Workers Static Assets
# Single deployment eliminates CORS issues between frontend and /api/* routes.
[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/health"]

# Keep Supabase Free Tier awake (pauses after 7 days of inactivity)
# Runs every 3 days at 00:00 UTC to execute `SELECT id FROM snippets LIMIT 1`.
[triggers]
crons = ["0 0 */3 * *"]

[vars]
SITE_ORIGIN = "https://shraff.tech"
RESEND_FROM_EMAIL = "shraff.tech <noreply@shraff.tech>"

# Secrets (NEVER commit actual values; configure via `wrangler secret put`):
# - SUPABASE_URL
# - SUPABASE_SERVICE_ROLE_KEY
# - UPSTASH_REDIS_REST_URL
# - UPSTASH_REDIS_REST_TOKEN
# - RESEND_API_KEY
